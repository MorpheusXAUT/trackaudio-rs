name: CI

on:
  push:
    branches: [ main ]
    paths: &rust_paths
      - '**/*.rs'
      - 'Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths: *rust_paths

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        checks:
          - 'advisories'
          - 'bans licenses sources'

    # prevent a sudden announcement of a new advisory from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          arguments: --all-features
          command: check ${{ matrix.checks }}

  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rust: [ '1.85.0', 'stable' ]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Rust toolchain (${{ matrix.rust }})
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --no-self-update --component clippy,rust-docs,rustfmt
          rustup default ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Only enforce formatting on stable to avoid rustfmt differences
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      # Only enforce checks on stable to avoid version differences
      - name: Check
        if: matrix.rust == 'stable'
        run: cargo check --all-targets --all-features

      # Only enforce clippy on stable to avoid version differences
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Only build docs on stable to avoid version differences
      - name: Docs
        if: matrix.rust == 'stable'
        run: cargo doc --all-features --no-deps

      - name: Tests
        run: cargo test --all-targets --all-features
