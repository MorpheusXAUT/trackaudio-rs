name: CI

# No `paths:` filter, deliberately. A required status check that a path filter
# skips never reports at all, and GitHub blocks the pull request waiting for it
# forever. Instead this always runs, works out what actually changed, and the
# gate job below reports a single status for the whole pipeline.
#
# `CI ✓` is the only check worth marking required.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - "**/*.rs"
              - "**/Cargo.toml"
              - "**/Cargo.lock"
              - "**/deny.toml"
              - ".github/workflows/**"

  cargo-deny:
    name: cargo deny (${{ matrix.checks }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        checks:
          - "advisories"
          - "bans licenses sources"

    # A newly published advisory should not fail CI on an unrelated change.
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
          command: check ${{ matrix.checks }}

  check:
    name: check (${{ matrix.rust }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (${{ matrix.rust }})
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --no-self-update --component clippy,rust-docs,rustfmt
          rustup default ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.rust }}

      # Only enforce formatting on stable to avoid rustfmt differences
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      # Only enforce checks on stable to avoid version differences
      - name: Check
        if: matrix.rust == 'stable'
        run: cargo check --locked --all-targets --all-features

      # Only enforce clippy on stable to avoid version differences
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Only build docs on stable to avoid version differences
      - name: Docs
        if: matrix.rust == 'stable'
        run: cargo doc --locked --all-features --no-deps

      - name: Tests
        run: cargo test --locked --all-targets --all-features

      # `--all-targets` excludes doctests, so they need their own invocation.
      - name: Doc tests
        run: cargo test --locked --doc --all-features

  features:
    name: features (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: none
            flags: "--no-default-features"
          - name: tracing
            flags: "--no-default-features --features tracing"
          - name: reconnect-jitter
            flags: "--no-default-features --features reconnect-jitter"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: features-${{ matrix.name }}

      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets ${{ matrix.flags }}

      - name: Doc tests
        run: cargo test --locked --doc ${{ matrix.flags }}

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # New zizmor releases add audits that can turn the gate red; bump deliberately.
      - name: Install zizmor
        run: pipx install zizmor==1.29.0

      - name: Run zizmor
        run: zizmor --no-online-audits --min-severity=low .github/

  # Blocks known-vulnerable dependencies; cargo-deny's advisories check is advisory.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gate:
    name: "CI ✓"
    # `changes` is listed so a failure there (which skips the rust jobs) fails the
    # gate instead of green-lighting a PR that ran no checks.
    needs: [changes, cargo-deny, check, features, zizmor, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          FEATURES_RESULT: ${{ needs.features.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          failed=false

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes: $CHANGES_RESULT (path detection must succeed)"
            failed=true
          else
            echo "changes: $CHANGES_RESULT"
          fi

          for name in cargo_deny check features zizmor dependency_review; do
            var="${name^^}_RESULT"
            result="${!var}"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *)               echo "::error::$name: $result"; failed=true ;;
            esac
          done

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "One or more required CI jobs failed."
            exit 1
          fi

          echo ""
          echo "All required checks passed or were skipped."

      - name: Summary
        if: always()
        env:
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          FEATURES_RESULT: ${{ needs.features.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac }

          echo "### CI Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| cargo deny | $(icon "$CARGO_DENY_RESULT") $CARGO_DENY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| check | $(icon "$CHECK_RESULT") $CHECK_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| features | $(icon "$FEATURES_RESULT") $FEATURES_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| zizmor | $(icon "$ZIZMOR_RESULT") $ZIZMOR_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency review | $(icon "$DEPENDENCY_REVIEW_RESULT") $DEPENDENCY_REVIEW_RESULT |" >> $GITHUB_STEP_SUMMARY
